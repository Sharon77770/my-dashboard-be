<!doctype html><meta charset="utf-8"><title>Chrome media fixture</title><style>body{margin:0;background:#152035;color:#fff;font:20px sans-serif}button{font-size:22px;padding:20px;margin:20px}canvas{display:block;width:100%;max-width:800px}</style><button onclick="play()">Play test tone + animation</button><canvas width="800" height="450"></canvas><script>const c=document.querySelector('canvas'),g=c.getContext('2d');function draw(t){g.fillStyle='#152035';g.fillRect(0,0,800,450);g.fillStyle='#879aff';g.fillRect((t/8)%740,100,60,200);requestAnimationFrame(draw)}draw(0);function play(){const a=new AudioContext(),o=a.createOscillator(),v=a.createGain();v.gain.value=.12;o.connect(v).connect(a.destination);o.start();document.querySelector('button').textContent='Playing server audio';}</script>
