services:
  tailscale:
    # Tailscale 1.102.3; stable image pinned for reproducible deployments.
    build: ./docker/tailscale
    restart: unless-stopped
    network_mode: service:dashboard
    depends_on:
      dashboard:
        condition: service_started
        restart: true
    entrypoint: ["/bin/sh", "/opt/dashboard-tailscale/start.sh"]
    environment:
      TS_HOSTNAME: ${TAILSCALE_HOSTNAME:-personal-dashboard}
      TS_STATE_DIR: /var/lib/tailscale
      TS_ACCEPT_DNS: ${TAILSCALE_ACCEPT_DNS:-true}
      TS_ACCEPT_ROUTES: ${TAILSCALE_ACCEPT_ROUTES:-false}
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - tailscale-state:/var/lib/tailscale
      - tailscale-control:/run/dashboard-tailscale
      - ./docker/tailscale/start.sh:/opt/dashboard-tailscale/start.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "tailscale status --peers=false >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  dashboard:
    build: .
    restart: unless-stopped
    ports:
      - "${DASHBOARD_BIND_ADDRESS:-127.0.0.1}:${DASHBOARD_PORT:-8080}:8080"
    environment:
      DASHBOARD_AUTH_ID: ${DASHBOARD_AUTH_ID:?Set DASHBOARD_AUTH_ID in .env}
      DASHBOARD_AUTH_PASSWORD: ${DASHBOARD_AUTH_PASSWORD:?Set DASHBOARD_AUTH_PASSWORD in .env}
      DASHBOARD_DB_PATH: /app/data/dashboard.db
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-30m}
      WORKSPACE_ROOT: /app/data/files
      NAS_ENABLED: ${NAS_ENABLED:-true}
      NAS_PUBLIC_URL: ${NAS_PUBLIC_URL:-}
      CLOUD_ROOT: ${CLOUD_ROOT:-/app/data/cloud}
      CREDENTIAL_KEY_PATH: /app/data/credential.key
      GUACD_HOST: 127.0.0.1
      BROWSER_HOST: 127.0.0.1
      UPLOAD_MAX_SIZE: ${UPLOAD_MAX_SIZE:-1GB}
    volumes:
      - dashboard-data:/app/data
      - tailscale-control:/run/dashboard-tailscale:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  guacd:
    image: guacamole/guacd:1.6.0
    restart: unless-stopped
    network_mode: service:dashboard
    command: ["-b", "127.0.0.1"]
    depends_on:
      dashboard:
        condition: service_started
        restart: true
  browser:
    build: ./docker/browser
    restart: unless-stopped
    network_mode: service:dashboard
    environment:
      BROWSER_LOCAL_ONLY: "true"
    shm_size: 1gb
    volumes:
      - browser-profile:/home/browser/profile
    security_opt:
      - no-new-privileges:true
    depends_on:
      dashboard:
        condition: service_started
        restart: true
volumes:
  dashboard-data:
  browser-profile:
  tailscale-state:
  tailscale-control:
