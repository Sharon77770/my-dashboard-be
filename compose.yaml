services:
  tailscale:
    # Tailscale 1.102.3; stable image pinned for reproducible deployments.
    build: ./docker/tailscale
    restart: unless-stopped
    network_mode: service:dashboard
    depends_on:
      dashboard:
        condition: service_started
        restart: true
    entrypoint: ["/bin/sh", "/opt/dashboard-tailscale/start.sh"]
    environment:
      TS_HOSTNAME: ${TAILSCALE_HOSTNAME:-personal-dashboard}
      TS_STATE_DIR: /var/lib/tailscale
      TS_ACCEPT_DNS: ${TAILSCALE_ACCEPT_DNS:-true}
      TS_ACCEPT_ROUTES: ${TAILSCALE_ACCEPT_ROUTES:-false}
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - tailscale-state:/var/lib/tailscale
      - tailscale-control:/run/dashboard-tailscale
      - ./docker/tailscale/start.sh:/opt/dashboard-tailscale/start.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "tailscale status --peers=false >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  dashboard:
    build:
      context: .
      args:
        WORKSPACE_APT_PACKAGES: ${WORKSPACE_APT_PACKAGES:-}
    restart: unless-stopped
    init: true
    # Zero keeps host/VM capacity available; deployments can set explicit ceilings.
    cpus: ${WORKSPACE_CPUS:-0}
    mem_limit: ${WORKSPACE_MEMORY_LIMIT:-0}
    shm_size: ${WORKSPACE_SHM_SIZE:-256m}
    ports:
      - "${DASHBOARD_BIND_ADDRESS:-127.0.0.1}:${DASHBOARD_PORT:-8080}:8080"
      - "${NAS_SMB_BIND_ADDRESS:?Set NAS_SMB_BIND_ADDRESS to a LAN interface IP or 127.0.0.1}:${NAS_SMB_HOST_PORT:-445}:445"
    environment:
      DASHBOARD_AUTH_ID: ${DASHBOARD_AUTH_ID:?Set DASHBOARD_AUTH_ID in .env}
      DASHBOARD_AUTH_PASSWORD: ${DASHBOARD_AUTH_PASSWORD:?Set DASHBOARD_AUTH_PASSWORD in .env}
      COMMUNICATION_DISCORD_GATEWAY_ENABLED: ${COMMUNICATION_DISCORD_GATEWAY_ENABLED:-false}
      COMMUNICATION_GOOGLE_CLIENT_ID: ${COMMUNICATION_GOOGLE_CLIENT_ID:-}
      COMMUNICATION_GOOGLE_CLIENT_SECRET: ${COMMUNICATION_GOOGLE_CLIENT_SECRET:-}
      COMMUNICATION_GOOGLE_REDIRECT_URI: ${COMMUNICATION_GOOGLE_REDIRECT_URI:-}
      COMMUNICATION_SLACK_SIGNING_SECRET: ${COMMUNICATION_SLACK_SIGNING_SECRET:-}
      COMMUNICATION_SLACK_CLIENT_ID: ${COMMUNICATION_SLACK_CLIENT_ID:-}
      COMMUNICATION_SLACK_CLIENT_SECRET: ${COMMUNICATION_SLACK_CLIENT_SECRET:-}
      COMMUNICATION_SLACK_REDIRECT_URI: ${COMMUNICATION_SLACK_REDIRECT_URI:-}
      DASHBOARD_MCP_TOKEN: ${DASHBOARD_MCP_TOKEN:-}
      DASHBOARD_DB_PATH: /app/data/dashboard.db
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-30m}
      WORKSPACE_ROOT: /app/data/files
      NAS_SMB_HOST: ${NAS_SMB_HOST:-}
      NAS_USERNAME: ${NAS_USERNAME:-}
      CLOUD_ROOT: ${CLOUD_ROOT:-/app/data/cloud}
      CREDENTIAL_KEY_PATH: /app/data/credential.key
      GUACD_HOST: 127.0.0.1
      BROWSER_HOST: 127.0.0.1
      UPLOAD_MAX_SIZE: ${UPLOAD_MAX_SIZE:-1GB}
      JAVA_TOOL_OPTIONS: ${DASHBOARD_JAVA_TOOL_OPTIONS:--Xms128m -Xmx1g}
    volumes:
      - dashboard-data:/app/data
      - communication-bridge-control:/run/communication-bridge:ro
      - tailscale-control:/run/dashboard-tailscale:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  nas-storage-init:
    build: ./docker/nas-storage-init
    restart: "no"
    command:
      - >-
        if [ -L /app/data/cloud ] || [ -L /app/data/cloud/files ]; then
          echo 'NAS storage path cannot be a symbolic link' >&2;
          exit 1;
        fi;
        if [ ! -d /app/data/cloud ]; then
          install -d -o 10001 -g 10001 /app/data/cloud;
        fi;
        if [ ! -d /app/data/cloud/files ]; then
          install -d -o 10001 -g 10001 /app/data/cloud/files;
        fi
    volumes:
      - dashboard-data:/app/data
    security_opt:
      - no-new-privileges:true
  samba:
    build: ./docker/samba
    restart: unless-stopped
    network_mode: service:dashboard
    environment:
      NAS_USERNAME: ${NAS_USERNAME:?Set NAS_USERNAME in .env}
      NAS_PASSWORD: ${NAS_PASSWORD:?Set NAS_PASSWORD in .env}
      NAS_UID: "10001"
      NAS_GID: "10001"
    volumes:
      - type: volume
        source: dashboard-data
        target: /nas/files
        volume:
          subpath: cloud/files
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    depends_on:
      nas-storage-init:
        condition: service_completed_successfully
      dashboard:
        condition: service_started
        restart: true
  guacd:
    image: guacamole/guacd:1.6.0
    restart: unless-stopped
    network_mode: service:dashboard
    command: ["-b", "127.0.0.1"]
    depends_on:
      dashboard:
        condition: service_started
        restart: true
  browser:
    stop_grace_period: 90s
    build: ./docker/browser
    restart: unless-stopped
    network_mode: service:dashboard
    environment:
      BROWSER_LOCAL_ONLY: "true"
    shm_size: ${BROWSER_SHM_SIZE:-1gb}
    volumes:
      - browser-profile:/home/browser/profile
      - communication-bridge-control:/run/communication-bridge
    security_opt:
      - no-new-privileges:true
    depends_on:
      dashboard:
        condition: service_started
        restart: true
  wine:
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/wine/Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    network_mode: service:dashboard
    volumes:
      - communication-wine-profile:/home/browser/profile
      - communication-bridge-control:/run/communication-bridge:ro
    security_opt:
      - no-new-privileges:true
    depends_on:
      dashboard:
        condition: service_started
        restart: true
      browser:
        condition: service_started
volumes:
  dashboard-data:
  browser-profile:
  communication-bridge-control:
  tailscale-state:
  tailscale-control:
  communication-wine-profile:
